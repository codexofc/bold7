name: Question
description: How something works, whether something is planned, how to build.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README and ROADMAP.md first. Questions about where to find BlackBerry files are not answered here.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Bold7 module version, if relevant
