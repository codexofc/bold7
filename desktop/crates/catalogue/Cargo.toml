[package]
name = "bold7-catalogue"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
